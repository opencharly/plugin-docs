# Makes this plugin repo a PROJECT so its own candy is actually gated.
#
# Without a root charly.yml the repo is "project-less": charly scans NO candies at all,
# so `charly box validate` at the repo root exits 0 on ANY manifest, including one with
# a malformed `plugin.providers` entry. The stock candy CI step asserted nothing.
# See opencharly/charly#459.
#
# Declaring discover: is the whole fix: the candy is scanned, the CUE schema gate
# applies, and the STOCK `charly box validate` step starts working with no workflow
# change. This file also declares the R10 witness bed (below).
discover:
    - path: candy
      recursive: true

# =============================================================================
# docs-resolve-app / docs-resolve — the R10 witness for THREE generator paths, all
# reached by the one `charly docs generate` this bed runs.
#
# WHY THIS BED EXISTS (1) — the extra_repos/release_repos RESOLUTION path
# (candy/plugin-docs catalog.go → refs.GitLatestTag, from the pinned
# github.com/opencharly/spec). The generator resolves a repo named in
# `extra_repos` to its newest CalVer tag via refs.GitLatestTag. A repo
# mid-migration carries BOTH the plain CalVer tags (v<YYYY>.<DDD>.<HHMM>) and the
# Go-module tags (v0.<YYYYDDD>.<HHMM>) the proxy-consumed root-module repos
# require; the pinned spec must rank the NEWER Go-form tag above a STALE plain
# tag, or the generated page freezes at the old plain tag (the defect that pinned
# plugin-gh to v2026.252.1501). This bed exercises that resolution END-TO-END on a
# disposable target: it composes THIS checkout's candy and runs `charly docs
# generate` over a hermetic fixture whose project declares extra_repos:
# [plugin-gh, plugin-box] — plugin-gh driving THIS path, plugin-box driving path
# (3) below — so the changed resolver path actually executes — then asserts the
# generated page is keyed by the Go-form tag.
#
# WHY THIS BED EXISTS (2) — the LANDING projection (gen_landing.go →
# liftLandingTagline). The home page is projected from the project's README.md,
# and the hero's tagline is lifted out of the body into the page frontmatter. The
# fixture README carries two badge lines between its H1 and its tagline — the
# shape a real README has, and the shape that used to make the projection
# hard-fail ("no tagline found") — so the third step asserts the tagline is lifted
# from UNDER the badges, the badges are kept in the body, and the tagline is not
# also left behind in it.
#
# WHY THIS BED EXISTS (3) — the CLI PAGE-PATH sanitizer (gen_cli.go →
# sanitizeSegment). Every other page-path producer sanitized its segment; the CLI
# emitter wrote the command word raw, so a `noun:verb` word (twelve of them live
# under `box` alone) landed at `reference/cli/build:box.md` while every link
# target — which DOES sanitize each segment — pointed at
# `/reference/cli/build-box/`. Nineteen such pages were committed to the docs repo
# before this bed caught it. The fixture therefore resolves plugin-box (whose candy
# declares those twelve words) through `extra_repos`, and its hand-authored start
# page links to one of them at the SANITIZED spelling: the page path the emitter
# writes and the link target the site resolves must agree, so the fixture's own
# link gate goes red on the raw-path regression and green once the emitter
# sanitizes. It is red-then-green through the existing gate, and the fourth step
# below asserts the page-path pair directly so the failure names itself.
#
# The fixture (candy/plugin-docs/testdata/bed-fixture) is self-contained and
# INTERNALLY CONSISTENT (its own project + narrative sources + hand-authored pages
# + astro config + the candy's testdata/marketplace corpus), so the generate
# reaches its link gates and passes — proving resolution against the REAL remote
# tags, not a stub.
# =============================================================================
docs-resolve-app:
    local:
        description: |-
            Minimal kind:local template for the docs-resolve bed — composes the local
            plugin-docs candy (no install content) so the bed exercises the generator's
            extra_repos resolution on a disposable host:local target.
        candy:
            - plugin-docs
docs-resolve:
    local:
        from: docs-resolve-app
        host: local
        disposable: true
        lifecycle: dev
        description: >-
            R10 witness for THREE docs-generator paths, all reached by the one `charly docs generate` this bed runs (the out-of-process command:docs plugin built from THIS checkout) against a hermetic fixture whose project declares `extra_repos: [plugin-gh, plugin-box]`. (1) The extra_repos/release_repos RESOLUTION path (candy/plugin-docs catalog.go → refs.GitLatestTag): the generated plugin-gh page must be keyed by the Go-module tag FORM (v0.<YYYYDDD>.<HHMM> → the page dir `...-v0-...`) — the resolution a stale plain tag (v<YYYY>.<DDD>.<HHMM> → `...-v2026-...`) would break. The assertion is FORM-based, not a pinned tag literal, so it stays green as plugin-gh advances and red exactly on the regression. (2) The LANDING projection (gen_landing.go → liftLandingTagline): the fixture README carries two badge lines between its H1 and its tagline, and a step asserts the tagline is lifted from UNDER them into the home page's frontmatter, that both badges are KEPT in the body, and that the tagline is not also left behind in it. (3) The CLI PAGE-PATH sanitizer (gen_cli.go → sanitizeSegment): the fixture's second extra repo, plugin-box, declares the twelve colon-carrying `command:<verb>:box` words, and the fixture's own hand-authored start page links to one of them at the SANITIZED spelling, so a step asserts the emitter wrote `reference/cli/build-box.md`, wrote no raw-colon page, and kept the word's RAW spelling in the page. The fixture's two extra repos are each load-bearing: plugin-gh for path (1), plugin-box for path (3).
        plan:
            - check: stage the hermetic fixture into a scratch site and run charly docs generate (the composed command:docs plugin) against a project with extra_repos [plugin-gh, plugin-box]
              id: docs-resolve-generate
              exit_status: 0
              context:
                - runtime
              command:
                in_container: false
                command: |
                    set -eu
                    FIX=candy/plugin-docs/testdata/bed-fixture
                    SITE=/tmp/docs-resolve-site
                    rm -rf "$SITE"
                    mkdir -p "$SITE/src/content/docs/start"
                    cp "$FIX/astro.config.mjs" "$SITE/astro.config.mjs"
                    cp "$FIX"/site/start/*.md "$SITE/src/content/docs/start/"
                    ${CHARLY_BIN} docs generate \
                      --root "$FIX/project" \
                      --plugins candy/plugin-docs/testdata/marketplace \
                      --out "$SITE/src/content/docs"
            - check: the generated plugin-gh page is keyed by a Go-module tag (v0.<YYYYDDD>.<HHMM>), NOT the stale plain tag
              id: docs-resolve-tag
              exit_status: 0
              context:
                - runtime
              stdout:
                - matches: 'plugin-gh-v0-\d{7}-\d+'
              command:
                in_container: false
                command: |
                    set -eu
                    DIR=/tmp/docs-resolve-site/src/content/docs/reference/plugin
                    # The Go-module form resolves to a dir like
                    # github-com-opencharly-plugin-gh-v0-2026267-723; the stale plain
                    # form would be ...-v2026-252-1501. Assert the Go form is present
                    # and the stale plain form is ABSENT.
                    if [ ! -d "$DIR" ]; then echo "no reference/plugin dir"; exit 1; fi
                    if ! ls "$DIR" | grep -Eq 'plugin-gh-v0-[0-9]{7}-[0-9]+'; then
                      echo "no Go-module-tag plugin-gh page; got:"; ls "$DIR" | grep plugin-gh || true; exit 1
                    fi
                    if ls "$DIR" | grep -Eq 'plugin-gh-v2026-.+'; then
                      echo "STALE plain-tag plugin-gh page present:"; ls "$DIR" | grep plugin-gh; exit 1
                    fi
                    ls "$DIR" | grep -E 'plugin-gh-v0-[0-9]{7}-[0-9]+'
            - check: the projected home page lifts the tagline from UNDER the hero's badge lines, keeps the badges in the body, and never prints the tagline twice
              id: docs-resolve-tagline
              exit_status: 0
              context:
                - runtime
              stdout:
                - matches: 'tagline: "A fixture root\.'
              command:
                in_container: false
                command: |
                    set -eu
                    INDEX=/tmp/docs-resolve-site/src/content/docs/index.md
                    [ -f "$INDEX" ] || { echo "no projected home page"; exit 1; }
                    # The fixture's README puts TWO badge lines between the H1 and the tagline —
                    # the shape charly's own README has. Anchoring the tagline to the line directly
                    # after the H1 made the projection hard-fail on that shape; the badges are
                    # stepped over instead, and the badges are KEPT in the body (only the tagline
                    # is lifted, because the hero renders it from the frontmatter).
                    grep -F 'tagline: "A fixture root."' "$INDEX"
                    for b in badge.svg second.svg; do
                      grep -qF "example.com/$b" "$INDEX" || { echo "badge $b dropped from the body"; exit 1; }
                    done
                    # Lifted, never ALSO left in the body: printing the tagline twice is the
                    # regression the position-anchoring exists to stop.
                    if grep -qF '**A fixture root.**' "$INDEX"; then
                      echo "tagline left in the body as well as in the frontmatter"; exit 1
                    fi
                    echo "tagline lifted from under the badges; both badges kept"
            - check: the CLI page path for a colon-carrying command word is the SANITIZED form, and no raw-colon page is written
              id: docs-resolve-cli-slug
              exit_status: 0
              context:
                - runtime
              stdout:
                - matches: 'build-box\.md'
              command:
                in_container: false
                command: |
                    set -eu
                    # plugin-box declares twelve colon-carrying `command:<verb>:box` words,
                    # and the fixture's hand-authored start page links to one of them at the
                    # SANITIZED spelling. The generate step above already exited 0, which
                    # means that link RESOLVED: the emitter wrote the page at the path the
                    # link sanitizer produces. This step names the pair, so a regression
                    # fails with both paths in hand rather than only a link error.
                    DIR=/tmp/docs-resolve-site/src/content/docs/reference/cli
                    [ -d "$DIR" ] || { echo "no reference/cli dir"; exit 1; }
                    if ls "$DIR" | grep -q ':'; then
                      echo "the emitter wrote a RAW colon page name:"; ls "$DIR" | grep ':'; exit 1
                    fi
                    [ -f "$DIR/build-box.md" ] || {
                      echo "expected the sanitized page reference/cli/build-box.md; got:"; ls "$DIR"; exit 1; }
                    # The word keeps its RAW spelling in the page — only the PATH is sanitized.
                    grep -qF 'build:box' "$DIR/build-box.md" || {
                      echo "the sanitized page lost the word's raw spelling"; exit 1; }
                    ls "$DIR" | grep -F 'build-box.md'
